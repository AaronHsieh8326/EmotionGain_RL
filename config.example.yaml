# 複製為 config.yaml，再填入本機模型與資料路徑。

model:
  name: "Llama-3.2-3B"
  path: "models/Llama-3.2-3B"
  emotions: ["joy", "sadness", "anger", "fear", "surprise", "neutral"]
  temperature: 1.0
  top_k: 50
  top_p: 0.9
  max_new_tokens: 40
  repetition_penalty: 1.1
  stop_after_first_sentence: true
  prefix_length: 20

data:
  # JSON/JSONL，標籤需先轉成情緒名稱。
  raw_path: "data/raw/goemotions_raw.json"
  path: "data/processed/goemotions_six_emotions.json"
  text_column: "text"
  label_column: "emotion"
  min_words: 4
  max_words: 30
  validation_fraction: 0.10
  split_seed: 42
  exclude_prompt_paths:
    - "data/private/warmup_dataset.json"

warmup:
  # 每筆包含 prompt、target_text、source_emotion、emotion。
  dataset_path: "data/private/warmup_dataset.json"
  learning_rate: 0.00005
  epochs: 10
  batch_size: 2
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  max_invalid_fraction: 0.05
  minimum_samples_per_target: 500
  generate:
    source_path: "data/processed/goemotions_six_emotions.json"
    input_path: "data/private/warmup_input_prompts.json"
    model: "gpt-4o-mini"
    responses_per_prompt: 5
    retry_limit: 3
    retry_delay: 1.0
    call_delay: 1.0
    temperature: 1.0
    source_emotion: "neutral"
    sample_seed: 42
    # 下列數量是原句數；每組 120 句 × 5 次改寫，最多 600 筆。
    # 五組共需 600 個不重複原句，篩選後每組至少留下 500 筆。
    samples_per_target_emotion:
      joy: 120
      sadness: 120
      anger: 120
      fear: 120
      surprise: 120

train:
  output_dir: "checkpoints/run_name"
  warmup_checkpoint: "checkpoints/run_name/warmup_prefix.pt"
  seed: 42
  max_steps: 3000
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.0
  sampling_mode: "shuffled_epoch"
  sampling_seed: 42
  source_emotions: ["neutral"]
  target_emotion_override: "joy"
  exclude_emotions: []
  advantage_normalization: "none"
  advantage_clip: 2.0
  reward_norm_window: 100
  grad_clip: 1.0
  invalid_penalty: 0.5
  kl_weight: 0.05
  curriculum_parrot_start: 0.85
  curriculum_parrot_end: 0.85
  parrot_moderate_offset: 0.10
  logging_steps: 25
  save_steps: 250

scorer:
  require_all_models: true
  strict_runtime: true
  threshold:
    semantic_min: 0.60
    cosine_min: 0.58
    contradiction_hard_fail: true
    parrot_soft_start: 0.75
    parrot_severe: 0.85
    max_length_ratio: 1.70
    max_extra_words: 8
    min_length_ratio: 0.50
    max_sentences: 1
    require_terminal_punctuation: true
  models:
    semantic: "sentence-transformers/all-MiniLM-L6-v2"
    nli: "cross-encoder/nli-deberta-v3-small"
    emotion_roberta: "SamLowe/roberta-base-go_emotions"
    emotion_distilbert: "bhadresh-savani/distilbert-base-uncased-emotion"
    fluency: "gpt2"
  reward:
    mode: "bounded_multidimensional"
    dynamic_weights: false
    emotion_weight: 0.35
    semantic_weight: 0.30
    fluency_weight: 0.20
    concision_weight: 0.15
    emotion_gain_cap: 0.50
    semantic_reward_floor: 0.60
    semantic_reward_ceiling: 0.85
    fluency_delta_scale: 0.25
    parrot_soft_penalty_max: 0.25
    nli_asymmetry_penalty: 0.05
    minimum_positive_gain: 0.05
    non_positive_gain_reward_cap: 0.0
    small_gain_reward_cap: 0.15
    threshold_fail_reward: -0.50
    severe_fail_reward: -0.80
    reward_min: -1.0
    reward_max: 1.0

feedback:
  alpha: 0.03
  history_path: "logs/training_history.json"
  target_emo_gain: 0.30
  target_fluency: 0.70
  emotion_weight_min: 0.40
  emotion_weight_max: 0.80
  fluency_weight_min: 0.20
  fluency_weight_max: 0.60
  momentum: 0.8
